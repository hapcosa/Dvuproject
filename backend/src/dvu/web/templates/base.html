<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="dvu-api" content="{{ api }}">
  <title>{{ titulo }} — DVU</title>
  <link rel="stylesheet" href="/estatico/dvu.css">
</head>
<body>
  <nav class="nav">
    <a href="/" {% if request.url.path == '/' %}class="activo"{% endif %}>Catálogo</a>
    <a href="/vendedor" {% if request.url.path == '/vendedor' %}class="activo"{% endif %}>Vendedor</a>
    <a href="/cobranza" {% if request.url.path == '/cobranza' %}class="activo"{% endif %}>Cobranza</a>
    <a href="/admin" {% if request.url.path == '/admin' %}class="activo"{% endif %}>Administrar</a>
    <span class="sep"></span>
    <span class="sesion" id="sesion"></span>
  </nav>

  <main class="hoja">
    {% block contenido %}{% endblock %}
  </main>

  <footer class="pie">
    Comercial DVU SpA · prototipo · los datos salen de la API en
    <code>{{ api }}</code>
  </footer>

  <script src="/estatico/dvu.js"></script>
  {% block script %}{% endblock %}
</body>
</html>
