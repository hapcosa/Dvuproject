name: dvu

x-api-base: &api-base
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: runtime
  env_file: [.env]
  volumes:
    - ./backend/src:/app/src:ro
    - ./catalago:/app/catalago:ro
    - ./data:/app/data
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio: {condition: service_healthy}
  restart: unless-stopped

services:
  api:
    <<: *api-base
    command: >
      uvicorn dvu.api.main:app
      --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips='*'
    ports: ["${DVU_API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *api-base
    command: arq dvu.workers.settings.WorkerSettings

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dvu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dvu_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dvu}
      # Chile: locale y timezone correctos desde la creación del cluster
      TZ: ${DVU_TZ:-America/Santiago}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["${POSTGRES_PORT_HOST:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dvu} -d ${POSTGRES_DB:-dvu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dvu_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dvu_minio_dev_password}
    volumes: [miniodata:/data]
    ports:
      - "${MINIO_PORT_HOST:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Crea el bucket al arrancar y termina. No es un servicio de larga vida.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    env_file: [.env]
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${DVU_S3_BUCKET} &&
      echo 'bucket listo'
      "
    restart: "no"

  # Tests del prototipo web sobre un DOM real (jsdom). No es un servicio de larga vida:
  # corre con `make test-web` y termina. Va en un perfil para que `make up` no lo levante.
  #
  # Vive en un contenedor y no en la máquina para no exigir node instalado: el repo se
  # abre con Docker y nada más. `node_modules` va en un volumen con nombre porque el
  # código se monta de sólo lectura y porque reinstalar jsdom en cada corrida son diez
  # segundos regalados.
  web-test:
    profiles: ["test"]
    image: node:22-alpine
    working_dir: /app/tests/navegador
    environment:
      DVU_WEB_URL: http://api:8000
      npm_config_cache: /tmp/npm
    volumes:
      - ./backend:/app:ro
      # En la raíz y no junto al test: el código va montado de sólo lectura y ahí no se
      # puede ni crear el punto de montaje. Node busca `node_modules` subiendo por los
      # directorios, así que en `/` lo encuentra igual.
      - webtestmodules:/node_modules
    depends_on:
      api: {condition: service_healthy}
    command: >
      sh -c "cp /app/tests/navegador/package.json / &&
             npm install --prefix / --no-save --no-package-lock --silent &&
             cd /app/tests/navegador && node --test"

volumes:
  pgdata:
  redisdata:
  miniodata:
  webtestmodules:
