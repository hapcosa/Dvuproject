# Overrides de DESARROLLO. Docker Compose lo aplica automáticamente.
# En producción se despliega con:  docker compose -f docker-compose.yml up -d
services:
  api:
    build:
      target: dev
    command: >
      uvicorn dvu.api.main:app
      --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    volumes:
      - ./backend/src:/app/src          # rw, para hot reload
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./catalago:/app/catalago:ro
      - ./data:/app/data

  worker:
    build:
      target: dev
    command: arq dvu.workers.settings.WorkerSettings --watch /app/src
    volumes:
      - ./backend/src:/app/src
      - ./catalago:/app/catalago:ro
      - ./data:/app/data
