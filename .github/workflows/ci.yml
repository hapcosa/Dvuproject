name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: backend/src

jobs:
  calidad:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dvu
          POSTGRES_PASSWORD: dvu
          POSTGRES_DB: dvu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dvu" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        working-directory: backend
        run: uv sync --all-extras

      - name: Lint (ruff)
        working-directory: backend
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Tipos (mypy)
        working-directory: backend
        run: uv run mypy src

      - name: Tests
        working-directory: backend
        env:
          DVU_ENV: test
          DVU_SECRET_KEY: test-secret-no-usar-en-produccion
          DVU_DATABASE_URL: postgresql+psycopg://dvu:dvu@localhost:5432/dvu_test
          DVU_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -m "not pdf"

      - name: Migraciones reversibles
        working-directory: backend
        env:
          DVU_SECRET_KEY: test-secret-no-usar-en-produccion
          DVU_DATABASE_URL: postgresql+psycopg://dvu:dvu@localhost:5432/dvu_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  imagen:
    name: Build de la imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (target runtime)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
